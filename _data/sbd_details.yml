# Yearly / editorial settings for the Soap Box Derby site.
# Edit this file (via the CMS at /admin/ or directly in GitHub) when:
#   - rolling over to a new event year
#   - opening or closing race entries
#   - changing the homepage banner

year: "2026"
entry_deadline: "5th September 2026"

# Set to true to open race entries, false to close them.
# Controls the registration form on /participating/register and
# the call-to-action on /participating.
entries_open: true

# Banner shown above the news on the homepage. Set enabled: false to hide it.
# When changing the message, just edit the text/link below — there is no need
# to touch the HTML in _layouts/frontpage.html.
homepage_banner:
  enabled: true
  highlight: true  # true uses the red attention-grabbing colour
  text: "Race entries are now open!"
  link_url: "/news/race-entries-are-open-2026"
  link_text: "Find out more in our blog post"

# Cancer Research UK fundraising URLs. CRUK creates new pages each year, so
# update these whenever you roll over to a new event year.
# Used by: /donate, /participating/sponsorship, /participating/pay-race-entry-fee
cruk:
  donate_url: "https://fundraise.cancerresearchuk.org/page/duxford-soap-box-derby-2026"
  team_fundraising_url: "https://fundraise.cancerresearchuk.org/team/duxford-soap-box-derby-2026s-team"
  race_entry_fee_url: "https://fundraise.cancerresearchuk.org/page/duxford-soap-box-derby-2026-race-entry-fees"
  auction_payment_url: "https://fundraise.cancerresearchuk.org/page/duxford-soap-box-derby-auction"
