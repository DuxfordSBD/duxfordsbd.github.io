<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Duxford Soap Box Derby — Content Manager</title>
  </head>
  <body>
    <!--
      Sveltia CMS pinned by version + Subresource Integrity hash.
      To upgrade:
        1. Check the latest version at https://www.npmjs.com/package/@sveltia/cms
        2. Update the version in the URL below (the @0.159.2 part)
        3. Recompute the SRI hash:
             curl -sL https://unpkg.com/@sveltia/cms@<version>/dist/sveltia-cms.js \
               | openssl dgst -sha384 -binary | openssl base64 -A
           Prefix the result with "sha384-" and put it in the integrity attribute.
        4. Test /admin/ before pushing — a wrong hash blocks the script from loading.
    -->
    <script type="module"
            src="https://unpkg.com/@sveltia/cms@0.159.2/dist/sveltia-cms.js"
            integrity="sha384-Ay8BeWnb6AXG0ehz54pF3zOTJJlKcb78VbY1Iq4ppwXtKWYoNZFm2K50ZVMLW95F"
            crossorigin="anonymous"></script>
  </body>
</html>
